<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a busy late-night chat app, calm chrome, loud content
   IDEA: a Discord-style hangout: rail, channels, chat, members
   PICTURE: the working chat itself fills the screen
   COLOUR and TYPE: charcoal slate, coral accent, Figtree
   LAYOUT: 72px rail, 240px sidebar, fluid chat, 220px members; sidebar slides in under 760px */
:root{color-scheme:light dark;
--rail:light-dark(#e2e4e9,#14161b);--side:light-dark(#f1f2f5,#1c1f25);--bg:light-dark(#fff,#24272e);
--ink:light-dark(#1b1e24,#e7e9ed);--mute:light-dark(#5b6270,#9aa1ae);--line:light-dark(#e0e2e7,#30343c);
--hov:light-dark(#e9ebef,#2b2f36);--in:light-dark(#ebedf1,#30343c);--acc:#ff6b4a;--acc2:light-dark(#d94a2a,#ff8a6e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{display:grid;grid-template-columns:72px 240px minmax(0,1fr) 220px;height:100%}
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.ri{width:48px;height:48px;border-radius:24px;background:var(--side);display:grid;place-items:center;font-weight:800;transition:border-radius .15s,background .15s;position:relative}
.ri:hover,.ri.on{border-radius:16px;background:var(--acc);color:#fff}
.ri.on::before{content:"";position:absolute;left:-12px;width:4px;height:36px;border-radius:0 4px 4px 0;background:var(--ink)}
.sep{width:32px;height:2px;background:var(--line);border-radius:2px}
#side{background:var(--side);display:flex;flex-direction:column}
.shead{height:52px;display:flex;align-items:center;padding:0 16px;font-weight:800;border-bottom:1px solid var(--line)}
#list{flex:1;overflow-y:auto;padding:12px 8px}
.lab{font-size:12px;font-weight:700;color:var(--mute);padding:14px 8px 6px}
.it{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 8px;border-radius:6px;color:var(--mute);text-align:left}
.it:hover{background:var(--hov);color:var(--ink)}.it.on{background:var(--hov);color:var(--ink);font-weight:600}
.hash{font-size:20px;width:22px;text-align:center;opacity:.7}
#mepanel{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--rail);min-height:56px}
#mepanel .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm{font-size:13px;color:var(--mute);padding:6px 10px;border-radius:6px}.sm:hover{background:var(--hov);color:var(--ink)}
#main{display:flex;flex-direction:column;background:var(--bg)}
.chead{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700}
.chead .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none;width:40px;height:40px;border-radius:8px;font-size:20px}
#note{display:none;padding:8px 16px;font-size:13px;background:light-dark(#fff1ec,#3a2722);color:var(--acc2)}
#msgs{flex:1;overflow-y:auto;padding:16px 0 8px}
.empty{padding:40px 24px;color:var(--mute)}.empty h2{color:var(--ink);font-size:28px;line-height:1.1;margin:0 0 6px}
.m{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 14px;padding:2px 16px 2px 16px}
.m.first{margin-top:14px}.m:hover{background:var(--hov)}
.m .gut{font-size:11px;color:var(--mute);text-align:center;padding-top:4px;opacity:0}.m:hover .gut{opacity:1}
.who{font-weight:700}.when{font-size:12px;color:var(--mute);margin-left:8px;font-weight:400}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.txt code{background:var(--in);padding:1px 5px;border-radius:4px;font-size:13px}
.txt a{color:var(--acc2)}
.ed{font-size:11px;color:var(--mute)}
.pic{display:block;max-width:min(420px,100%);max-height:340px;border-radius:8px;margin-top:6px;cursor:zoom-in}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx{display:flex;align-items:center;gap:4px;min-height:28px;padding:2px 8px;border-radius:8px;background:var(--in);border:1px solid transparent;font-size:14px}
.rx.mine{border-color:var(--acc);background:light-dark(#ffece6,#3d2a25)}
.acts{position:absolute;right:16px;top:-14px;display:none;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:2px}
.m:hover .acts,.m:focus-within .acts{display:flex}
.acts button{min-width:36px;height:32px;border-radius:6px;font-size:13px;padding:0 8px}.acts button:hover{background:var(--hov)}
.acts .del.arm{background:var(--acc);color:#fff}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden;object-fit:cover}
#comp{padding:0 16px 20px}
#prev{display:none;position:relative;margin-bottom:8px;width:max-content;max-width:100%}
#prev img{max-height:120px;border-radius:8px;display:block}
#prev button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;background:#000a;color:#fff}
.box{display:flex;align-items:flex-end;gap:4px;background:var(--in);border-radius:10px;padding:6px 8px}
.box button{width:40px;height:40px;border-radius:8px;font-size:22px;color:var(--mute)}.box button:hover{color:var(--ink)}
#txt{flex:1;resize:none;border:0;background:none;outline:none;font-size:16px;padding:9px 4px;max-height:200px}
#txt:disabled{opacity:.6}
#mem{background:var(--side);overflow-y:auto;padding:12px 8px}
#pick{position:fixed;display:none;gap:2px;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:20;box-shadow:0 8px 24px #0004}
#pick button{width:40px;height:40px;border-radius:8px;font-size:20px}#pick button:hover{background:var(--hov)}
.ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:30;padding:16px}
.card{background:var(--bg);border-radius:14px;padding:28px;width:min(420px,100%)}
.card h2{margin:0 0 4px;font-size:26px;line-height:1.1}.card p{margin:0 0 18px;color:var(--mute)}
.card label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:14px 0 6px}
.card input[type=text]{width:100%;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--in);padding:0 12px;font-size:16px}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw button{width:36px;height:36px;border-radius:18px}.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.avrow{display:flex;align-items:center;gap:12px}
.btn{height:44px;padding:0 18px;border-radius:8px;background:var(--acc);color:#fff;font-weight:700}
.btn2{height:44px;padding:0 14px;border-radius:8px;background:var(--in)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
#zoom img{max-width:100%;max-height:90vh;border-radius:8px}
.ri img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.ri{overflow:visible}.ri img{display:block}
.ri.add{color:#3fb37f;font-size:26px;font-weight:500}.ri.add:hover{background:#3fb37f;color:#fff}
.ri.big{width:64px;height:64px;border-radius:20px;background:var(--acc);color:#fff;overflow:hidden}
#rail{overflow-y:auto}
.shead .sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gear{width:40px;height:40px;border-radius:8px;font-size:20px;color:var(--mute)}.gear:hover{background:var(--hov);color:var(--ink)}
.lrow{display:flex;align-items:center;justify-content:space-between}
.mini{width:32px;height:32px;border-radius:6px;font-size:20px;color:var(--mute)}.mini:hover{color:var(--ink);background:var(--hov)}
.own{font-size:11px;color:#f2a33a;margin-left:auto;font-weight:700}
.card.wide{width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.tb{overflow-y:auto;padding-right:4px;margin-top:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{min-height:40px;padding:0 14px;border-bottom:3px solid transparent;color:var(--mute);font-weight:600}
.tabs button.on{border-color:var(--acc);color:var(--ink)}
.frow{display:flex;align-items:center;gap:8px;margin:6px 0}
.frow input[type=text]{flex:1}
.card input[type=color]{width:44px;height:44px;border:0;padding:0;background:none;border-radius:8px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.link{color:var(--acc2);text-decoration:underline;font-size:13px;min-height:0;padding:0}
.danger{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.red{color:#e5484d}.btn2.red:hover{background:#e5484d;color:#fff}
.role,.mrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0}
.chk{display:flex!important;align-items:flex-start;gap:10px;margin:8px 0!important;font-size:14px!important;font-weight:400!important;color:var(--ink)!important}
.chk input,.rchip input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--acc)}
.chk span{color:var(--mute)}.chk b{color:var(--ink);display:block}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rchip{display:flex!important;align-items:center;gap:6px;margin:0!important;min-height:36px;padding:0 10px;border-radius:18px;background:var(--in);font-size:14px!important;font-weight:600!important}
.row.l{justify-content:flex-start;flex-wrap:wrap;margin-top:10px}
.err{display:none;color:#e5484d;font-size:14px;margin-top:10px}
@media(max-width:1100px){#app{grid-template-columns:72px 240px minmax(0,1fr)}#mem{display:none}}
@media(max-width:760px){#app{grid-template-columns:minmax(0,1fr)}
 #rail,#side{position:fixed;top:0;bottom:0;z-index:10;transform:translateX(-120%);transition:transform .2s}
 #rail{left:0;width:72px}#side{left:72px;width:min(280px,calc(100vw - 72px))}
 body.nav #rail,body.nav #side{transform:none}#menu{display:block}
 .acts{display:flex;position:static;grid-column:2;width:max-content;margin-top:4px;background:none;border:0}
 .m .gut{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Servers"></nav>
  <aside id="side">
    <div class="shead" id="sideTitle">Harbor</div>
    <div id="list"></div>
    <div id="mepanel"><span id="meAv"></span><span class="nm" id="meName">Connecting...</span><button class="sm" id="editMe">Edit</button></div>
  </aside>
  <main id="main">
    <div class="chead"><button id="menu" aria-label="Open channels">&#9776;</button><span class="t" id="chTitle"># general</span></div>
    <div id="note"></div>
    <div id="msgs" aria-live="polite"><div class="empty"><h2>Loading chat</h2>Connecting to the server.</div></div>
    <div id="comp">
      <div id="prev"><img alt="Image to send"><button id="unpic" aria-label="Remove image">&times;</button></div>
      <div class="box">
        <button id="att" title="Attach image" aria-label="Attach image">+</button>
        <textarea id="txt" rows="1" maxlength="2000" placeholder="Message #general" disabled></textarea>
        <button id="send" title="Send" aria-label="Send">&#10148;</button>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <input type="file" id="avfile" accept="image/*" hidden>
      <input type="file" id="srvfile" accept="image/*" hidden>
    </div>
  </main>
  <aside id="mem" aria-label="Members"></aside>
</div>
<div id="pick"></div>
<div class="ov" id="setup"><div class="card">
  <h2>Pick your look</h2><p>This is how others see you in chat.</p>
  <label for="nmIn">Display name</label><input type="text" id="nmIn" maxlength="24" placeholder="Your name">
  <label>Color</label><div class="sw" id="sw"></div>
  <label>Avatar (optional)</label>
  <div class="avrow"><span id="avPrev"></span><button class="btn2" id="avBtn">Upload picture</button><button class="btn2" id="avClear">Remove</button></div>
  <div class="row"><button class="btn2" id="setCancel">Cancel</button><button class="btn" id="setSave">Save</button></div>
</div></div>
<div class="ov" id="modal" role="dialog" aria-modal="true"><div class="card wide"></div></div>
<div class="ov" id="zoom"><img alt="Full size image"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const SB_URL='https://ewfiupvsjxmwafpllmju.supabase.co',SB_KEY='sb_publishable_RFSBXanaI72rg2BH0AEbZw_uCi5sK4T';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
const COLORS=['#ff6b4a','#f2a33a','#3fb37f','#2f9bd6','#6c63ff','#d04fa8','#7a8494','#c2453a'];
const EMO=['\u{1F44D}','❤️','\u{1F602}','\u{1F62E}','\u{1F622}','\u{1F525}','\u{1F389}','\u{1F440}'];
const PERMS=[['p_admin','Administrator','Can do everything, including roles'],['p_server','Manage server','Change name, icon and invite code'],['p_channels','Manage channels','Create, rename and delete channels'],['p_kick','Kick and moderate','Kick members and delete any message']];
const S={uid:null,profiles:{},servers:[],members:[],channels:[],roles:[],mroles:[],mode:'srv',sid:null,view:null,room:'',msgs:[],img:null,draftAv:null,draftColor:COLORS[0],editing:null,pickFor:null,justOpened:false,tab:'overview',srvIcon:undefined};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const P=id=>S.profiles[id]||{};
const nameOf=id=>P(id).name||'Someone';
const tm=t=>{const d=new Date(t),n=new Date(),h=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return d.toDateString()===n.toDateString()?'Today at '+h:d.toLocaleDateString()+' '+h};
const note=t=>{const n=$('#note');n.textContent=t||'';n.style.display=t?'block':'none'};
const chName=s=>s.toLowerCase().trim().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,30);
const initials=n=>n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'?';

/* ---- server helpers ---- */
const srv=()=>S.servers.find(s=>s.id===S.sid);
const chans=sid=>S.channels.filter(c=>c.server_id===sid).sort((a,b)=>a.position-b.position||a.created_at.localeCompare(b.created_at));
const rolesIn=sid=>S.roles.filter(r=>r.server_id===sid).sort((a,b)=>a.position-b.position);
const rolesOf=(sid,uid)=>{const ids=S.mroles.filter(m=>m.server_id===sid&&m.uid===uid).map(m=>m.role_id);return rolesIn(sid).filter(r=>ids.includes(r.id))};
const membersOf=sid=>S.members.filter(m=>m.server_id===sid).map(m=>m.uid);
function can(p,sid=S.sid){
  const s=S.servers.find(x=>x.id===sid);if(!s)return false;if(s.owner===S.uid)return true;
  return rolesOf(sid,S.uid).some(r=>r.p_admin||(p&&r[p]));
}
const colorIn=(uid,sid=S.sid)=>{if(S.view&&S.view.type==='ch'){const r=rolesOf(sid,uid).find(r=>r.color);if(r)return r.color}return P(uid).color||'inherit'};

const av=(id,sz,src)=>{const p=P(id),a=src!==undefined?src:p.avatar;return a?`<img class="av" src="${esc(a)}" width="${sz}" height="${sz}" alt="">`:`<span class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.42}px;background:${esc(p.color||'#7a8494')}">${esc((p.name||'?')[0].toUpperCase())}</span>`};
const srvIcon=s=>s.icon?`<img src="${esc(s.icon)}" alt="">`:esc(initials(s.name));

async function shrink(file,max,limit){
  const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  let q=.82,u;do{u=c.toDataURL('image/jpeg',q);q-=.12}while(u.length>limit&&q>.2);
  if(u.length>limit)throw new Error('too big');return u;
}

/* ---- rendering ---- */
function renderRail(){
  $('#rail').innerHTML=`<button class="ri ${S.mode==='dm'?'on':''}" data-home title="Direct messages" aria-label="Direct messages">DM</button><div class="sep"></div>`+
    S.servers.map(s=>`<button class="ri ${S.mode==='srv'&&S.sid===s.id?'on':''}" data-srv="${s.id}" title="${esc(s.name)}" aria-label="${esc(s.name)}">${srvIcon(s)}</button>`).join('')+
    `<button class="ri add" data-addsrv title="Add a server" aria-label="Add a server">+</button>`;
}
function renderSide(){
  renderRail();
  let h='';
  if(S.mode==='srv'&&srv()){
    const s=srv();
    $('#sideTitle').innerHTML=`<span class="sn">${esc(s.name)}</span><button class="gear" data-settings aria-label="Server settings" title="Server settings">&#9881;</button>`;
    h=`<div class="lab lrow">Text channels${can('p_channels')?'<button class="mini" data-addch aria-label="Add channel" title="Add channel">+</button>':''}</div>`+
      chans(s.id).map(c=>`<button class="it ${S.view&&S.view.type==='ch'&&S.view.id===c.id?'on':''}" data-ch="${c.id}"><span class="hash">#</span>${esc(c.name)}</button>`).join('');
  }else if(S.mode==='srv'){
    $('#sideTitle').textContent='No servers yet';
    h='<div class="lab" style="font-weight:400">Make your own server or join one with an invite code.</div><button class="btn" style="margin:8px" data-addsrv>Add a server</button>';
  }else{
    $('#sideTitle').textContent='Direct messages';
    const ids=[...new Set(S.members.map(m=>m.uid))].filter(i=>i!==S.uid).sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
    h='<div class="lab">People from your servers</div>'+(ids.length?ids.map(i=>`<button class="it ${S.view&&S.view.type==='dm'&&S.view.id===i?'on':''}" data-dm="${esc(i)}">${av(i,32)}<span>${esc(nameOf(i))}</span></button>`).join(''):'<div class="lab" style="font-weight:400">Nobody yet. Invite friends to a server first.</div>');
  }
  $('#list').innerHTML=h;
  $('#meAv').innerHTML=S.uid?av(S.uid,32):'';
  $('#meName').textContent=S.uid?(P(S.uid).name||'Set your name'):'Offline';
}
function renderMembers(){
  const s=srv();
  if(S.mode!=='srv'||!s){$('#mem').innerHTML='';return}
  const ids=membersOf(s.id),groups=new Map();
  rolesIn(s.id).forEach(r=>groups.set(r.id,{r,ids:[]}));
  const rest=[];
  ids.forEach(u=>{const top=rolesOf(s.id,u)[0];top?groups.get(top.id).ids.push(u):rest.push(u)});
  const row=u=>`<button class="it" data-dm="${esc(u)}">${av(u,32)}<span style="color:${esc(colorIn(u,s.id))}">${esc(nameOf(u))}</span>${u===s.owner?'<span class="own">owner</span>':''}</button>`;
  const sort=a=>a.sort((x,y)=>nameOf(x).localeCompare(nameOf(y)));
  $('#mem').innerHTML=[...groups.values()].filter(g=>g.ids.length).map(g=>`<div class="lab">${esc(g.r.name)}, ${g.ids.length}</div>`+sort(g.ids).map(row).join('')).join('')+
    (rest.length?`<div class="lab">Members, ${rest.length}</div>`+sort(rest).map(row).join(''):'');
}
function renderHead(){
  const v=S.view;let t='',ph='';
  if(!v){t='';ph='Pick a channel'}
  else if(v.type==='ch'){const c=S.channels.find(c=>c.id===v.id);t='# '+(c?c.name:'');ph='Message #'+(c?c.name:'')}
  else{t='@ '+nameOf(v.id);ph='Message @'+nameOf(v.id)}
  $('#chTitle').textContent=t;$('#txt').placeholder=ph;$('#txt').disabled=!v||!S.uid;
}
function renderMsgs(){
  const box=$('#msgs'),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120,v=S.view;
  if(!v){box.innerHTML=S.mode==='srv'&&!S.servers.length?'<div class="empty"><h2>Welcome to Harbor</h2>Create a server for you and your friends, or join one with an invite code.<br><br><button class="btn" data-addsrv>Add a server</button></div>':'<div class="empty"><h2>Nothing open</h2>Pick a channel or a person.</div>';return}
  if(!S.msgs.length){
    const c=S.channels.find(c=>c.id===v.id);
    box.innerHTML=v.type==='ch'?`<div class="empty"><h2>Welcome to #${esc(c?c.name:'')}</h2>This is the start of the channel. Say something.</div>`:`<div class="empty"><h2>${esc(nameOf(v.id))}</h2>This is the start of your direct messages with ${esc(nameOf(v.id))}.</div>`;
    return;
  }
  const mod=v.type==='ch'&&can('p_kick');

  box.innerHTML=S.msgs.map(m=>{
    const first=!prev||prev.uid!==m.uid||m.ts-prev.ts>300000;prev=m;
    const mine=m.uid===S.uid;
    const rx=Object.entries(m.reacts||{}).map(([e,o])=>{const us=Object.keys(o);return us.length?`<button class="rx ${o[S.uid]?'mine':''}" data-rx="${esc(e)}" data-id="${m.id}" title="${esc(us.map(nameOf).join(', '))}">${esc(e)} ${us.length}</button>`:''}).join('');

      <div class="acts"><button data-react="${m.id}" aria-label="Add reaction">React</button>${mine?`<button data-edit="${m.id}">Edit</button>`:''}${mine||mod?`<button class="del" data-del="${m.id}">Delete</button>`:''}</div>
    </div>`;

const room=v=>v.type==='ch'?'c:'+v.id:'dm:'+[S.uid,v.id].sort().join('+');
let loadT=0,allT=0;
const schedule=()=>{clearTimeout(loadT);loadT=setTimeout(loadRoom,120)};
const scheduleAll=()=>{clearTimeout(allT);allT=setTimeout(loadAll,200)};
async function loadAll(){
  const [sv,mb,ch,rl,mr,pf]=await Promise.all([
    sb.from('harbor_servers').select('id,name,icon,owner,invite,created_at').order('created_at'),
    sb.from('harbor_members').select('server_id,uid'),
    sb.from('harbor_channels').select('id,server_id,name,position,created_at'),
    sb.from('harbor_roles').select('*'),
    sb.from('harbor_member_roles').select('server_id,uid,role_id'),
    sb.from('harbor_profiles').select('id,name,color,avatar')]);
  const err=[sv,mb,ch,rl,mr,pf].find(r=>r.error);
  if(err){note('Could not load servers: '+err.error.message);return}
  S.servers=sv.data;S.members=mb.data;S.channels=ch.data;S.roles=rl.data;S.mroles=mr.data;
  S.profiles={};pf.data.forEach(p=>S.profiles[p.id]=p);
  // keep the current view valid
  if(S.mode==='srv'){
    if(!srv())S.sid=S.servers[0]?.id||null;
    const list=S.sid?chans(S.sid):[];
    if(!S.view||S.view.type!=='ch'||!list.some(c=>c.id===S.view.id)){if(list[0])openView({type:'ch',id:list[0].id});else{S.view=null;S.room='';S.msgs=[]}}
  }
  renderAll();
}
async function loadRoom(){
  const r=S.room;if(!r)return;
  const {data,error}=await sb.from('harbor_messages').select('id,uid,text,img,edited,created_at').eq('room',r).order('created_at',{ascending:false}).limit(100);
  if(r!==S.room)return;
  if(error){note('Could not load messages.');return}
  const msgs=data.reverse().map(m=>({...m,ts:Date.parse(m.created_at),reacts:{}}));
  if(msgs.length){
    const {data:rx}=await sb.from('harbor_reactions').select('message_id,uid,emoji').in('message_id',msgs.map(m=>m.id));
    if(r!==S.room)return;
    (rx||[]).forEach(x=>{const m=msgs.find(m=>m.id===x.message_id);if(m)(m.reacts[x.emoji]??={})[x.uid]=true});
  }
  S.msgs=msgs;renderMsgs();
}
function openView(v){
  S.view=v;S.editing=null;S.msgs=[];S.justOpened=true;
  document.body.classList.remove('nav');
  S.room=room(v);
  $('#msgs').innerHTML='<div class="empty"><h2>Loading</h2>Fetching messages.</div>';
  renderSide();renderMembers();renderHead();loadRoom();
  if(window.innerWidth>760)$('#txt').focus();
}
function openServer(id){
  S.mode='srv';S.sid=id;S.view=null;
  const c=chans(id)[0];if(c)openView({type:'ch',id:c.id});else renderAll();
}
async function send(){
  const t=$('#txt'),text=t.value.trim();
  if(!S.uid||!S.room||(!text&&!S.img))return;
  const row={room:S.room,text};if(S.img)row.img=S.img;
  t.value='';autosize();setImg(null);
  const {error}=await sb.from('harbor_messages').insert(row);
  if(error){t.value=text;note('Message failed to send. Try again.');return}
  note('');schedule();
}
async function toggleReact(id,e){
  const m=S.msgs.find(x=>x.id===id);if(!m)return;
  const mine=m.reacts[e]&&m.reacts[e][S.uid];
  const {error}=await(mine?sb.from('harbor_reactions').delete().match({message_id:id,uid:S.uid,emoji:e}):sb.from('harbor_reactions').insert({message_id:id,emoji:e}));
  if(error)note('Reaction failed.');schedule();
}
async function saveEdit(id,text){
  S.editing=null;const m=S.msgs.find(x=>x.id===id);
  if(!m||text.trim()===m.text||(!text.trim()&&!m.img)){renderMsgs();return}
  const {error}=await sb.from('harbor_messages').update({text:text.trim(),edited:true}).eq('id',id);
  if(error)note('Edit failed.');schedule();
}
async function delMsg(id){const {error}=await sb.from('harbor_messages').delete().eq('id',id);if(error)note('Delete failed.');schedule()}

  const owner=s.owner===S.uid,tabs=[['overview','Overview',true],['channels','Channels',can('p_channels')],['roles','Roles',can('p_admin')],['members','Members',can('p_kick')||can('p_admin')]].filter(t=>t[2]);

      `<label for="newCh">New channel</label><div class="frow"><input type="text" id="newCh" maxlength="30" placeholder="new-channel"><button class="btn" data-do="addCh">Add</button></div><div class="hint">Lowercase letters, numbers and dashes. Deleting a channel deletes its messages.</div>`;
  }else if(S.tab==='roles'){
    body=rolesIn(s.id).map(r=>`<div class="role" data-role="${r.id}">
      <div class="frow"><input type="color" value="${esc(r.color||'#99a0ad')}" data-f="color" aria-label="Role color"><input type="text" value="${esc(r.name)}" maxlength="30" data-f="name" aria-label="Role name"></div>
      ${PERMS.map(([k,l,d])=>`<label class="chk"><input type="checkbox" data-f="${k}" ${r[k]?'checked':''}><span><b>${l}</b> ${d}</span></label>`).join('')}
      <div class="row l"><button class="btn" data-do="saveRole" data-id="${r.id}">Save</button><button class="btn2" data-do="upRole" data-id="${r.id}" aria-label="Move up">Up</button><button class="btn2" data-do="downRole" data-id="${r.id}" aria-label="Move down">Down</button><button class="btn2 red" data-do="delRole" data-id="${r.id}">Delete</button></div></div>`).join('')+
      `<div class="row l"><button class="btn" data-do="addRole">Create role</button></div><div class="hint">Roles higher in the list show first in the member list. A member's name color comes from their highest role with a color.</div>`;
  }else{
    const adm=can('p_admin'),kick=can('p_kick'),rs=rolesIn(s.id);
    body=membersOf(s.id).sort((a,b)=>nameOf(a).localeCompare(nameOf(b))).map(u=>{const mine=rolesOf(s.id,u).map(r=>r.id);return `<div class="mrow"><div class="frow">${av(u,32)}<b style="flex:1">${esc(nameOf(u))}</b>${u===s.owner?'<span class="own">owner</span>':kick&&u!==S.uid?`<button class="btn2 red" data-do="kick" data-id="${esc(u)}">Kick</button>`:''}</div>

async function act(fn,okMsg){const {error}=await fn;if(error){mErr(error.message);return false}mErr('');await loadAll();return true}
const armed=new Set();
const twoStep=(b,key)=>{if(armed.has(key))return true;armed.add(key);b.textContent='Sure?';setTimeout(()=>{armed.delete(key);if(b.isConnected)drawSettings()},3000);return false};

async function onModal(e){
  const tab=e.target.closest('[data-tab]');if(tab){S.tab=tab.dataset.tab;drawSettings();return}
  const b=e.target.closest('[data-do]');if(!b)return;
  const d=b.dataset.do,id=b.dataset.id,s=srv();
  if(d==='close')return closeModal();
  if(d==='create')return createServer();
  if(d==='join')return joinServer($('#joinCode').value);
  if(!s)return;
  if(d==='copy'){const i=$('#invLink');try{await navigator.clipboard.writeText(i.value);b.textContent='Copied'}catch(_){i.select();b.textContent='Press Ctrl+C'}setTimeout(()=>b.isConnected&&(b.textContent='Copy'),2000);return}
  if(d==='icon')return $('#srvfile').click();
  if(d==='noicon'){S.srvIcon=null;return drawSettings()}
  if(d==='saveSrv'){const name=$('#sName').value.trim();if(!name)return mErr('The server needs a name.');const up={name};if(S.srvIcon!==undefined)up.icon=S.srvIcon;if(await act(sb.from('harbor_servers').update(up).eq('id',s.id)))S.srvIcon=undefined;return}
  if(d==='regen')return act(sb.from('harbor_servers').update({invite:Math.random().toString(36).slice(2,10).padEnd(8,'0')}).eq('id',s.id));
  if(d==='delSrv'){if(!twoStep(b,'del'+s.id))return;const {error}=await sb.from('harbor_servers').delete().eq('id',s.id);if(error)return mErr(error.message);closeModal();S.sid=null;S.view=null;return loadAll()}
  if(d==='leave'){if(!twoStep(b,'leave'+s.id))return;const {error}=await sb.from('harbor_members').delete().match({server_id:s.id,uid:S.uid});if(error)return mErr(error.message);closeModal();S.sid=null;S.view=null;return loadAll()}
  if(d==='addCh'){const n=chName($('#newCh').value);if(!n)return mErr('Type a channel name.');const pos=Math.max(-1,...chans(s.id).map(c=>c.position))+1;return act(sb.from('harbor_channels').insert({server_id:s.id,name:n,position:pos}))}
  if(d==='renCh'){const n=chName($(`[data-chname="${id}"]`).value);if(!n)return mErr('Type a channel name.');return act(sb.from('harbor_channels').update({name:n}).eq('id',id))}
  if(d==='delCh'){if(chans(s.id).length<2)return mErr('A server needs at least one channel.');if(!twoStep(b,'ch'+id))return;return act(sb.from('harbor_channels').delete().eq('id',id))}
  if(d==='addRole'){const pos=Math.max(-1,...rolesIn(s.id).map(r=>r.position))+1;return act(sb.from('harbor_roles').insert({server_id:s.id,name:'new role',color:COLORS[pos%COLORS.length],position:pos}))}
  if(d==='saveRole'){const box=b.closest('[data-role]'),up={};box.querySelectorAll('[data-f]').forEach(i=>up[i.dataset.f]=i.type==='checkbox'?i.checked:i.value.trim());if(!up.name)return mErr('The role needs a name.');return act(sb.from('harbor_roles').update(up).eq('id',id))}
  if(d==='delRole'){if(!twoStep(b,'r'+id))return;return act(sb.from('harbor_roles').delete().eq('id',id))}
  if(d==='upRole'||d==='downRole'){
    const rs=rolesIn(s.id),i=rs.findIndex(r=>r.id===id),j=d==='upRole'?i-1:i+1;if(j<0||j>=rs.length)return;
    const a=rs[i],c=rs[j];
    if(!await act(sb.from('harbor_roles').update({position:j}).eq('id',a.id)))return;
    return act(sb.from('harbor_roles').update({position:i}).eq('id',c.id));
  }
  if(d==='kick'){if(!twoStep(b,'k'+id))return;return act(sb.from('harbor_members').delete().match({server_id:s.id,uid:id}))}
}

$('#msgs').addEventListener('keydown',e=>{
  if(e.target.id!=='editBox')return;
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEdit(S.editing,e.target.value)}
  if(e.key==='Escape'){S.editing=null;renderMsgs()}
});
$('#pick').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(b&&S.pickFor)toggleReact(S.pickFor,b.dataset.e);hidePick()});
document.addEventListener('click',e=>{if(!e.target.closest('#pick'))hidePick()});
$('#zoom').onclick=()=>$('#zoom').style.display='none';
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();else onModal(e)});
$('#modal').addEventListener('change',onGrant);
$('#modal').addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='newName')createServer();if(e.key==='Enter'&&e.target.id==='joinCode')joinServer(e.target.value);if(e.key==='Enter'&&e.target.id==='newCh')$('[data-do="addCh"]').click()});
$('#srvfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{S.srvIcon=await shrink(f,128,40000);drawSettings()}catch(_){mErr('That picture could not be used.')}};
$('#editMe').onclick=()=>S.uid&&openSetup();
$('#sw').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){S.draftColor=b.dataset.c;drawSetup()}});
$('#nmIn').addEventListener('input',drawSetup);
$('#nmIn').addEventListener('keydown',e=>{if(e.key==='Enter')saveSetup()});
$('#avBtn').onclick=()=>$('#avfile').click();
$('#avfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{S.draftAv=await shrink(f,128,40000);drawSetup()}catch(_){note('That picture could not be used.')}};
$('#avClear').onclick=()=>{S.draftAv=null;drawSetup()};
$('#setCancel').onclick=()=>$('#setup').style.display='none';
$('#setSave').onclick=saveSetup;

/* ---- start ---- */
renderAll();
(async()=>{
  const off=t=>{$('#msgs').innerHTML='<div class="empty"><h2>Chat is offline</h2>'+t+'</div>';$('#meName').textContent='Offline'};
  if(!sb){off('The chat library did not load. Check your internet and reload.');return}
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error){off('Could not join: '+esc(r.error.message));return}session=r.data.session}
  S.uid=session.user.id;
  await loadAll();
  if(!S.profiles[S.uid])openSetup();
  const code=(location.hash.match(/^#join=([a-z0-9]+)/i)||[])[1];
  if(code){history.replaceState(null,'',location.pathname);await joinServer(code)}
  const t=n=>({event:'*',schema:'public',table:n});
  sb.channel('harbor')
    .on('postgres_changes',t('harbor_messages'),p=>{if(p.eventType==='DELETE'?S.msgs.some(m=>m.id===p.old.id):p.new.room===S.room)schedule()})
    .on('postgres_changes',t('harbor_reactions'),p=>{const mid=(p.new&&p.new.message_id)||(p.old&&p.old.message_id);if(S.msgs.some(m=>m.id===mid))schedule()})
    .on('postgres_changes',t('harbor_profiles'),scheduleAll)
    .on('postgres_changes',t('harbor_servers'),scheduleAll)
    .on('postgres_changes',t('harbor_members'),scheduleAll)
    .on('postgres_changes',t('harbor_channels'),scheduleAll)
    .on('postgres_changes',t('harbor_roles'),scheduleAll)
    .on('postgres_changes',t('harbor_member_roles'),scheduleAll)
    .subscribe(st=>{if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')note('Live updates paused. New messages show when you send or switch channel.');if(st==='SUBSCRIBED')note('')});
})();
}
</script>
</body>
</html>
